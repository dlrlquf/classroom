{# 앱 호스트 화면 상단에 넣는 접속 코드/QR 코드. join_code, join_url, qr_code가 필요하다. #}
<aside class="join-info"
    id="join-info"
    {% if request.endpoint == 'main.home' %}hidden{% endif %}>
    <h2>접속 코드</h2>
    <p class="join-code">{{ join_code }}</p>
    {% if qr_code %}
    <img
        class="site-qr-code"
        src="data:image/svg+xml;base64,{{ qr_code }}"
        alt="접속 주소 {{ join_url }}를 담은 QR 코드"
    >
    <p><a href="{{ join_url }}">{{ join_url }}</a></p>
    {% else %}
    <p>서버 IP 주소를 확인할 수 없어 QR 코드를 표시하지 못했습니다.</p>
    {% endif %}
</aside>
