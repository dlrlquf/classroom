{% extends 'base.html' %}

{% block title %}클래스 플로우{% endblock %}

{% block host_content %}
<h1>클래스 플로우</h1>
<p>준비 중입니다.</p>
<input id="start_question" type="button" value="질문 시작">
{% endblock %}

{% block scripts %}
<script>
    // console.log("Classflow host script loaded");
    document.getElementById("start_question").addEventListener("click", () => {
        socket.emit("classflow_start_question");
    });
    socket.on("classflow_question_asked", () => {
        alert("질문이 시작되었습니다.");
    });
</script>
{% endblock %}
