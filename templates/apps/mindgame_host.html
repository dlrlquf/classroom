{% extends 'base.html' %}

{% block title %}눈치게임{% endblock %}

{% block host_content %}
<h1>눈치게임</h1>
<section class="admin-game">
    <h2>게임 설정</h2>
    <label class="mindgame-interval-label" for="mindgame-interval">
        연속 클릭 게임오버 간격 (초)
    </label>
    <input id="mindgame-interval" type="number" min="0.1" max="60" step="0.1"
        value="2" required>
    <button type="button" id="mindgame-start" class="item-btn">게임 시작</button>
    <button type="button" id="mindgame-stop" class="item-btn" disabled>게임 종료</button>
    <p id="mindgame-status" role="status" aria-live="polite">
        판정 간격을 설정하고 게임을 시작하세요.
    </p>
</section>

<section>
    <h2>누른 순서</h2>
    <ol id="mindgame-click-order" class="mindgame-click-order"></ol>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/mindgame_host.js') }}"></script>
{% endblock %}
