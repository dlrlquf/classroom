<section class="response-user">
    <h1 id="response-user-prompt">대기 중</h1>
    <p id="response-user-type"></p>
    <div id="response-user-options" class="response-user-options"></div>
    <form id="response-short-form" class="settings-form" hidden>
        <label for="response-short-answer">짧은 답변</label>
        <input id="response-short-answer" maxlength="40" autocomplete="off">
        <button type="submit" class="item-btn">제출</button>
    </form>
    <p id="response-user-status" role="status" aria-live="polite">
        호스트가 활동을 시작하기를 기다리는 중입니다.
    </p>
</section>
