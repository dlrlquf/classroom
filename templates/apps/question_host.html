{% extends 'base.html' %}

{% block title %}질문하기{% endblock %}

{% block host_content %}
<h1>질문하기</h1>
<p id="question-class-label"></p>
<section class="question-list-panel">
    <h2>질문 세션</h2>
    <form id="question-session-form" class="chat-form">
        <label for="question-session-name">새 세션 이름</label>
        <input id="question-session-name" type="text" maxlength="60"
            placeholder="예: 1교시 질문" autocomplete="off" required>
        <button type="submit" class="item-btn">세션 열기</button>
    </form>
    <label for="question-session-select">질문받을 세션</label>
    <select id="question-session-select" disabled>
        <option value="">세션을 선택해 주세요</option>
    </select>
    <p id="question-session-status" role="status" aria-live="polite"></p>
</section>
<section class="question-list-panel">
    <h2>받은 질문</h2>
    <p id="question-status" role="status" aria-live="polite"></p>
    <ol id="question-list"></ol>
</section>
{% endblock %}

{% block scripts %}
<script>
    const questionList = document.querySelector("#question-list");
    const questionStatus = document.querySelector("#question-status");
    const classLabel = document.querySelector("#question-class-label");
    const sessionForm = document.querySelector("#question-session-form");
    const sessionNameInput = document.querySelector("#question-session-name");
    const sessionSelect = document.querySelector("#question-session-select");
    const sessionStatus = document.querySelector("#question-session-status");
    let activeSessionId = null;
    let displayedQuestions = [];

    function renderQuestions(questions) {
        displayedQuestions = questions;
        questionList.replaceChildren();
        const groupedQuestions = new Map();
        questions.forEach((item) => {
            if (!groupedQuestions.has(item.name)) {
                groupedQuestions.set(item.name, []);
            }
            groupedQuestions.get(item.name).push(item);
        });

        groupedQuestions.forEach((participantQuestions, name) => {
            const participant = document.createElement("li");
            participant.className = "question-participant";
            const participantHeading = document.createElement("div");
            participantHeading.className = "question-participant-heading";
            const heading = document.createElement("strong");
            heading.textContent = name;
            const toggleQuestions = document.createElement("button");
            toggleQuestions.type = "button";
            toggleQuestions.className = "question-toggle";
            toggleQuestions.textContent = "펼치기";
            toggleQuestions.setAttribute("aria-expanded", "false");
            const items = document.createElement("ul");
            items.className = "question-participant-questions";
            items.hidden = true;
            participantQuestions.forEach((item) => {
                const row = document.createElement("li");
                row.className = "question-item saved";
                const content = document.createElement("p");
                content.textContent = item.question;
                const state = document.createElement("span");
                state.textContent = "저장됨";
                row.append(content, state);
                items.appendChild(row);
            });
            toggleQuestions.addEventListener("click", () => {
                items.hidden = !items.hidden;
                toggleQuestions.textContent = items.hidden ? "펼치기" : "접기";
                toggleQuestions.setAttribute(
                    "aria-expanded",
                    String(!items.hidden)
                );
            });
            participantHeading.append(heading, toggleQuestions);
            participant.append(participantHeading, items);
            questionList.appendChild(participant);
        });
    }

    function handleState(response) {
        if (!response || !response.ok) {
            sessionStatus.textContent =
                (response && response.message) || "질문 세션을 불러오지 못했습니다.";
            return;
        }
        if (response.class) {
            classLabel.textContent = `${response.class.name} 반 질문 목록`;
        }

        const sessions = response.sessions || [];
        sessionSelect.replaceChildren();
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = sessions.length
            ? "질문받을 세션을 선택해 주세요"
            : "세션을 먼저 만들어 주세요";
        sessionSelect.appendChild(placeholder);
        sessions.forEach((session) => {
            const option = document.createElement("option");
            option.value = String(session.id);
            option.textContent = session.name;
            sessionSelect.appendChild(option);
        });

        const activeSession = response.active_session;
        activeSessionId = activeSession ? activeSession.id : null;
        sessionSelect.value = activeSession ? String(activeSession.id) : "";
        sessionSelect.disabled = sessions.length === 0;
        sessionStatus.textContent = activeSession
            ? `현재 질문을 받고 있는 세션: ${activeSession.name}`
            : "세션을 만들거나 선택하면 질문을 받을 수 있습니다.";
        renderQuestions(response.questions || []);
    }

    function syncQuestions() {
        socket.emit("question_sync", handleState);
    }

    sessionForm.addEventListener("submit", (event) => {
        event.preventDefault();
        socket.emit(
            "create_question_session",
            { name: sessionNameInput.value },
            (response) => {
                handleState(response);
                if (response && response.ok) {
                    sessionNameInput.value = "";
                    sessionStatus.textContent =
                        `질문을 받고 있습니다: ${response.active_session.name}`;
                }
            }
        );
    });

    sessionSelect.addEventListener("change", () => {
        const sessionId = Number(sessionSelect.value);
        if (!sessionId) return;
        socket.emit(
            "select_question_session",
            { session_id: sessionId },
            handleState
        );
    });

    socket.on("question_asked", (data) => {
        if (!data || !data.question || data.session_id !== activeSessionId) return;
        renderQuestions([...displayedQuestions, data.question]);
        questionStatus.textContent =
            `${data.question.name}님의 질문이 도착해 저장되었습니다.`;
    });

    socket.on("question_session_state", handleState);
    socket.on("connect", syncQuestions);
    if (socket.connected) syncQuestions();
</script>
{% endblock %}
