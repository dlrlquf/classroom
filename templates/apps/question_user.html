<h2>질문하기</h2>
<p>수업과 관련된 질문을 입력해 주세요.</p>
<p id="question-session-status" role="status" aria-live="polite">
    질문 세션 정보를 불러오는 중입니다.
</p>
<form id="question-form" class="chat-form">
    <input id="question" type="text" maxlength="500"
        placeholder="질문을 입력하세요" autocomplete="off" required disabled>
    <button id="ask_question" type="submit" class="item-btn" disabled>질문하기</button>
</form>
<p id="question-status" role="status" aria-live="polite"></p>
